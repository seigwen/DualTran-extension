<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Page for Testing</title>
</head>
<body>
  <h1>Hello World</h1>
  <p id="paragraph-1">This is a sample paragraph for translation testing.</p>
  <p id="paragraph-2">This is another paragraph with <strong>bold text</strong> and <em>italic text</em>.</p>
  <div id="container">
    <span class="text-node">Nested text content</span>
    <a href="https://example.com">A link</a>
  </div>
  <textarea id="input-area">Editable content</textarea>
  <select id="language-select">
    <option value="en">English</option>
    <option value="fr">French</option>
    <option value="de">German</option>
  </select>
</body>
</html>
