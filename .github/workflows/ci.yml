name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Unit Tests (zero tolerance)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Run unit tests
      run: npm test

    - name: Run build
      run: npm run build

    - name: Upload build artifact
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: extension-build
        path: dist/chrome/
        retention-days: 7

  e2e:
    name: Browser E2E (xvfb, 1 retry)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Build extension
      run: npm run build

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # 全量 20+1 个浏览器 E2E 场景（真实 Chrome + 扩展 + xvfb）。
    # 失败自动重试 1 次（E2E 存在环境级偶发波动）；两次都失败则任务失败。
    - name: Run browser E2E suite (attempt 1)
      id: e2e-attempt-1
      continue-on-error: true
      run: xvfb-run -a node tests/browser-e2e/run-all.mjs

    - name: Run browser E2E suite (retry)
      if: steps.e2e-attempt-1.outcome == 'failure'
      run: xvfb-run -a node tests/browser-e2e/run-all.mjs

    - name: Upload E2E logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-logs
        path: /tmp/*.log
        retention-days: 7

    # V2（issue #75）：保真度门禁——声明的 mustDifferFrom 对不得渲染成同一状态。
    # 放在 artifact 上传之前：门禁失败时 artifact 仍会因 if: always() 上传，取证不丢。
    - name: Visual fidelity gate (declared must-differ pairs must not render identically)
      if: always()
      run: node scripts/check-visual-fidelity.mjs --dir /tmp/e2e-shots

    # V1（issue #67）：视觉检查点截图 + 失败现场图。
    # 供 Hermes 原生视觉按 visual-checks.mjs 清单审查（VQ3/VQ4）。
    - name: Upload visual artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-visual-shots
        path: /tmp/e2e-shots/
        retention-days: 14
        if-no-files-found: warn

  coverage:
    name: Coverage (non-blocking)
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Upload coverage report
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

  i18n-check:
    name: i18n Check (hard failure)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for accidental Chinese in source (hard failure)
      run: node scripts/check-no-chinese.js

  test-architecture-check:
    name: Test Architecture Checks (hard failure)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Assertion strength (no false-green / no-assertion tests)
      run: node scripts/check-assertion-strength.js

    - name: Mode symmetry (newLine/replaceOriginal + color matrix)
      run: node scripts/check-mode-symmetry.mjs

    - name: Rule symmetry (implementation points have test references)
      run: node scripts/check-rule-symmetry.js

    - name: UI state init (no hardcoded closure state — SPA rebuild bug)
      run: node scripts/check-ui-state-init.js

    - name: Observer mount (never document.body — Turbo body replacement bug)
      run: node scripts/check-observer-mount.js

    - name: Mock fidelity (E2E mock pages declare simulated behavior)
      run: node scripts/check-mock-fidelity.js

    - name: Mock fidelity vitest (arrival-path mocks declare importOriginal or reason, #72)
      run: node scripts/check-mock-fidelity-vitest.js

    - name: Infra assumptions (every assumption has a test reference)
      run: node scripts/check-infra-assumptions.js

    - name: State reachability (S1 matrix rows reference real tests; no attachShadow escape)
      run: node scripts/check-state-reachability.js

    - name: Host state assertions (E2E must use tri-state assertHostState; no raw exists booleans)
      run: node scripts/check-host-state-assertions.js

    - name: Visual checks (checkpoints ↔ captures bidirectional coverage, expect[] present)
      run: node scripts/check-visual-checks.js
