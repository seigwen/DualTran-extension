name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm test

    - name: Run build
      run: npm run build

    - name: Upload build artifact
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: extension-build
        path: dist/chrome/
        retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Upload coverage report
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

  i18n-check:
    name: i18n Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for Chinese in source (excluding _locales)
      run: |
        MATCHES=$(grep -rPn '[\x{4e00}-\x{9fff}]' src/ \
          --include='*.js' --include='*.html' \
          | grep -v '_locales/' || true)
        if [ -n "$MATCHES" ]; then
          echo "::warning::Found Chinese text in source files (excluding _locales/):"
          echo "$MATCHES"
          echo ""
          echo "Please translate to English. i18n user-facing strings should go through _locales/."
          # Uncomment to make this a hard failure:
          # exit 1
        else
          echo "✅ No Chinese text found in source files (excluding _locales/)."
        fi
