name: Canary Rehearsal (TEMPORARY — deleted before merge)

# S5 rehearsal (issue #57): validate the canary.yml issue-mechanism
# command chain INSIDE a real GitHub Actions environment — gh CLI
# availability + GITHUB_TOKEN issues:write permissions + dedup/close
# semantics. The local command-chain rehearsal validated semantics only;
# this validates the execution environment. Self-cleaning: creates a
# test issue, exercises dedup + close, then deletes it.
#
# This file is removed in the same PR that adds canary.yml.

on:
  push:
    branches: [feat/s5-real-site-canary]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rehearsal:
    name: Issue chain rehearsal
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Exercise the canary issue command chain
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        SEARCH='canary: real-site verification failed in:title'
        DATE=$(date -u +%Y-%m-%d)

        echo "── step 1: ensure a clean slate"
        EXISTING=$(gh issue list --search "$SEARCH" --state open --json number --jq '.[0].number // empty')
        if [ -n "$EXISTING" ]; then
          echo "closing stale open canary issue #$EXISTING (rehearsal cleanup)"
          gh issue close "$EXISTING" --comment "Rehearsal cleanup (pre-existing issue)."
        fi

        echo "── step 2: failure path, no existing issue → create"
        BODY_FILE=$(mktemp)
        {
          echo "**Rehearsal issue — validates the canary failure-path command chain in Actions.**"
          echo ""
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "- This issue is deleted automatically at the end of the rehearsal."
          echo ""
          echo "<!-- canary-auto -->"
        } > "$BODY_FILE"

        # NOTE: a freshly created issue is not immediately findable via
        # search (indexing latency, proven in the local rehearsal), so the
        # dedup check here happens AFTER create — that's what we validate.
        gh issue create \
          --title "canary: real-site verification failed ($DATE)" \
          --label "bug,priority: high,area: build" \
          --body-file "$BODY_FILE"
        echo "created"

        echo "── step 3: wait for search indexing (bounded, best-effort)"
        # The workflow's real dedup lookup happens on the NEXT failure
        # (a week later) — index latency is a non-issue in production.
        # Here we poll up to 90s to still validate the search form.
        FOUND=""
        for i in $(seq 1 18); do
          EXISTING=$(gh issue list --search "$SEARCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then FOUND="$EXISTING"; break; fi
          sleep 5
        done
        if [ -z "$FOUND" ]; then
          echo "!! search did not index the new issue within 90s — using REST fallback"
          # REST list has no indexing latency: find by exact title prefix.
          FOUND=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("canary: real-site verification failed"))][0].number // empty')
          echo "REST fallback found: #$FOUND"
        fi
        if [ -z "$FOUND" ]; then
          echo "!! FAIL: could not locate the rehearsal issue at all"
          exit 1
        fi
        echo "dedup target: #$FOUND"

        echo "── step 4: failure path, existing issue → dedup comment (no new issue)"
        BEFORE_COUNT=$(gh issue list --state open --limit 100 --json number,title \
          --jq '[.[] | select(.title | startswith("canary: real-site verification failed"))] | length')
        gh issue comment "$FOUND" --body "Rehearsal dedup comment — a second failure must comment, not open a new issue."
        AFTER_COUNT=$(gh issue list --state open --limit 100 --json number,title \
          --jq '[.[] | select(.title | startswith("canary: real-site verification failed"))] | length')
        echo "issue count before=$BEFORE_COUNT after=$AFTER_COUNT"
        if [ "$BEFORE_COUNT" != "$AFTER_COUNT" ]; then
          echo "!! FAIL: dedup path created an extra issue"
          exit 1
        fi

        echo "── step 5: success path → close + recovery comment"
        gh issue comment "$FOUND" --body "Canary green again (rehearsal). Closing."
        gh issue close "$FOUND"
        STATE=$(gh issue view "$FOUND" --json state --jq .state)
        if [ "$STATE" != "CLOSED" ]; then
          echo "!! FAIL: close did not take effect (state=$STATE)"
          exit 1
        fi
        echo "closed #$FOUND"

        echo "── step 6: cleanup — delete the rehearsal issue"
        gh issue delete "$FOUND" --yes
        echo "deleted #$FOUND"

        echo "✅ REHEARSAL PASSED: create / dedup-comment / close / delete all behave as designed in Actions"
