name: Phase 3 content-update calibration

on:
  workflow_dispatch:

jobs:
  content-update:
    name: Content update (real Google translation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VISUAL_ASSERT_MODE: warn
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Build extension
      run: npm run build

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run content-update scenario
      run: xvfb-run -a node tests/browser-e2e/run-all.mjs --scenario=content-update-conformance

    - name: Upload visual artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phase3-content-shots
        path: /tmp/e2e-shots/
        retention-days: 7
        if-no-files-found: warn
