name: Real-Site Canary

# Weekly real-github.com canary (S5, issue #57).
#
# Runs the scenario library (scripts/canary-scenarios.mjs) against the
# real site via scripts/real-site-verify.mjs. This is a SIGNAL SOURCE,
# not a PR gate: real-site tests have environmental noise (site
# changes, network), so failures open (or comment on) an issue for
# human judgment instead of silently reddening a run.
#
# Platform note: GitHub Actions pauses `schedule` triggers after 60
# days of repository inactivity — a dormant repo's canary goes quiet
# without an error. Re-enable by pushing/using workflow_dispatch.

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3:00 AM UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Real-site canary (xvfb, 1 retry)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Build extension
      run: npm run build

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # Failure here means the extension may be broken on the real site.
    # One retry first: real-site runs have environmental noise (network,
    # site flakiness) — a single failure is not yet a signal.
    - name: Run canary (attempt 1)
      id: canary-attempt-1
      continue-on-error: true
      run: xvfb-run -a node scripts/real-site-verify.mjs

    - name: Run canary (retry)
      id: canary-attempt-2
      if: steps.canary-attempt-1.outcome == 'failure'
      run: xvfb-run -a node scripts/real-site-verify.mjs

    - name: Upload canary logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: canary-logs
        path: /tmp/*.log
        retention-days: 30

    # Failure handling: open (or comment on) an issue for human judgment.
    - name: Open or update canary issue on failure
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        DATE=$(date -u +%Y-%m-%d)
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        SEARCH='canary: real-site verification failed in:title'
        EXISTING=$(gh issue list --search "$SEARCH" --state open --json number --jq '.[0].number // empty')

        BODY_FILE=$(mktemp)
        {
          echo "**Canary run failed on the real site (github.com scenario library).**"
          echo ""
          echo "- Run: $RUN_URL"
          echo "- Trigger: ${{ github.event_name }}"
          echo ""
          echo "This is a canary signal, not a PR gate — real-site runs have environmental"
          echo "noise (site changes, network). Human judgment required:"
          echo ""
          echo "1. Open the run URL and check the scenario diagnostics (\`[FAIL] <name>\` lines + step timeline)."
          echo "2. If GitHub changed its UI/cache headers, update \`scripts/canary-scenarios.mjs\` selectors/paths."
          echo "3. If the extension regressed, file a bug and fix via the normal TDD flow."
          echo ""
          echo "Full logs: artifact \`canary-logs\` on the run (retention 30 days)."
          echo ""
          echo "<!-- canary-auto -->"
        } > "$BODY_FILE"

        if [ -n "$EXISTING" ]; then
          # Dedup: comment on the existing open issue instead of opening a new one.
          gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          echo "Commented on existing canary issue #$EXISTING"
        else
          gh issue create \
            --title "canary: real-site verification failed ($DATE)" \
            --label "bug,priority: high,area: build" \
            --body-file "$BODY_FILE"
          echo "Opened new canary issue"
        fi

    # Success handling: close a stale canary issue (the signal recovered).
    - name: Close canary issue on success
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SEARCH='canary: real-site verification failed in:title'
        EXISTING=$(gh issue list --search "$SEARCH" --state open --json number --jq '.[0].number // empty')
        if [ -n "$EXISTING" ]; then
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "$EXISTING" --body "Canary is green again as of $(date -u +%Y-%m-%d). Closing. Run: $RUN_URL"
          gh issue close "$EXISTING"
          echo "Closed canary issue #$EXISTING (recovered)"
        else
          echo "No open canary issue — nothing to close"
        fi
