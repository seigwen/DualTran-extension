name: Real-Site Canary

# Weekly multi-site canary (S5, issue #57; multi-site expansion + translation-
# reality gate: plan 34, issue #114).
#
# Runs the scenario library (scripts/canary-scenarios.mjs) against 10 real
# sites via scripts/real-site-verify.mjs (13 scenarios: github.com ×3 +
# workers.dev ×2 + vercel.com ×2 + nextjs/nuxt/svelte/angular/astro/gitlab).
# x.com is LOCAL-only (Cloudflare blocks the runner IP range — plan 34 §二.3).
#
# This is a SIGNAL SOURCE, not a PR gate: real-site tests have environmental
# noise (site changes, network), so failures open (or comment on) an issue
# for human judgment instead of silently reddening a run.
#
# Exit-code contract (plan 34 §三.B): 0 = PASSED, 1 = FAILED,
# 2 = SKIPPED-ENV (Google gtx endpoint throttled — the run is not
# attributable). SKIP-ENV neither opens nor closes issues, and is NOT
# retried (a throttle window lasts hours; an immediate retry is pointless).
#
# Platform note: GitHub Actions pauses `schedule` triggers after 60
# days of repository inactivity — a dormant repo's canary goes quiet
# without an error. Re-enable by pushing/using workflow_dispatch.

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3:00 AM UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Real-site canary (xvfb, 1 retry on real failures only)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Build extension
      run: npm run build

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # Failure here means the extension may be broken on a real site.
    # One retry first — but ONLY on exit code 1 (a real red). SKIP-ENV (2)
    # is a throttle window (hours long): retrying immediately doubles the
    # runtime without changing the outcome. PASS (0) needs no retry.
    #
    # `set -o pipefail` is REQUIRED: the default Actions shell is plain
    # `bash -e` without pipefail, so `node ... | tee` would return tee's
    # exit code (0) and silently mask canary failures — breaking both the
    # retry logic and the issue mechanism. The explicit PIPESTATUS capture
    # keeps the step itself green (outcome conveyed via code output).
    - name: Run canary (attempt 1)
      id: canary-attempt-1
      run: |
        set +e
        set -o pipefail
        xvfb-run -a node scripts/real-site-verify.mjs 2>&1 | tee /tmp/canary-attempt1.log
        code=${PIPESTATUS[0]:-0}
        echo "code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Run canary (retry)
      id: canary-attempt-2
      if: steps.canary-attempt-1.outputs.code == '1'
      run: |
        set +e
        set -o pipefail
        xvfb-run -a node scripts/real-site-verify.mjs 2>&1 | tee /tmp/canary-attempt2.log
        code=${PIPESTATUS[0]:-0}
        echo "code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Evaluate canary outcome
      id: canary-outcome
      run: |
        c1="${{ steps.canary-attempt-1.outputs.code }}"
        c2="${{ steps.canary-attempt-2.outputs.code }}"
        effective="${c2:-$c1}"
        echo "effective=$effective" >> "$GITHUB_OUTPUT"
        case "$effective" in
          0) echo "::notice::canary PASSED";;
          2) echo "::warning::canary SKIPPED-ENV (Google endpoint throttled) — not a failure, not a green";;
          *) echo "canary FAILED (exit $effective)"; exit 1;;
        esac

    - name: Upload canary logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: canary-logs
        path: /tmp/*.log
        retention-days: 30

    # Failure handling: open (or comment on) an issue for human judgment.
    # Only reachable when the outcome step made the job fail (effective=1).
    # SKIP-ENV (2) never gets here — a throttle window must not file bugs.
    - name: Open or update canary issue on failure
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        DATE=$(date -u +%Y-%m-%d)
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        SEARCH='canary: real-site verification failed in:title'
        EXISTING=$(gh issue list --search "$SEARCH" --state open --json number --jq '.[0].number // empty')

        BODY_FILE=$(mktemp)
        {
          echo "**Canary run failed on the real-site matrix (10-site scenario library).**"
          echo ""
          echo "- Run: $RUN_URL"
          echo "- Trigger: ${{ github.event_name }}"
          echo ""
          echo "This is a canary signal, not a PR gate — real-site runs have environmental"
          echo "noise (site changes, network). Human judgment required:"
          echo ""
          echo "1. Open the run URL and check the scenario diagnostics (\`[FAIL] <name>\` lines + step timeline)."
          echo "2. If the site changed its UI/structure, update \`scripts/canary-scenarios.mjs\` selectors/paths."
          echo "3. If the extension regressed, file a bug and fix via the normal TDD flow."
          echo ""
          echo "Note: exit 2 (SKIP-ENV) runs are Google-endpoint throttle windows — those do"
          echo "NOT open issues and are visible as a workflow \`::warning::\` instead."
          echo ""
          echo "Full logs: artifact \`canary-logs\` on the run (retention 30 days)."
          echo ""
          echo "<!-- canary-auto -->"
        } > "$BODY_FILE"

        if [ -n "$EXISTING" ]; then
          # Dedup: comment on the existing open issue instead of opening a new one.
          gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          echo "Commented on existing canary issue #$EXISTING"
        else
          gh issue create \
            --title "canary: real-site verification failed ($DATE)" \
            --label "bug,priority: high,area: build" \
            --body-file "$BODY_FILE"
          echo "Opened new canary issue"
        fi

    # Success handling: close a stale canary issue (the signal recovered).
    # Guarded to effective=0 (real PASS) — a SKIP-ENV must never close a
    # real defect's issue (plan 34 §三.E).
    - name: Close canary issue on success
      if: success() && steps.canary-outcome.outputs.effective == '0'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SEARCH='canary: real-site verification failed in:title'
        EXISTING=$(gh issue list --search "$SEARCH" --state open --json number --jq '.[0].number // empty')
        if [ -n "$EXISTING" ]; then
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "$EXISTING" --body "Canary is green again as of $(date -u +%Y-%m-%d). Closing. Run: $RUN_URL"
          gh issue close "$EXISTING"
          echo "Closed canary issue #$EXISTING (recovered)"
        else
          echo "No open canary issue — nothing to close"
        fi
