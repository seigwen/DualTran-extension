name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build extension
      run: npm run build

    # Release gate (S5, issue #57; typed-skip discipline: plan 34 §三.E):
    # the canary must pass against the real-site matrix before a release
    # artifact is produced. Exit-code contract: 0=PASSED, 1=FAILED,
    # 2=SKIPPED-ENV (Google endpoint throttled).
    #   - 1 (after one retry on real reds only) blocks the release;
    #   - 2 lets the release through WITH a prominent warning — Google's
    #     risk controls must not hold the release cadence, and the full
    #     E2E suite has already gated this build anyway;
    #   - 0 passes silently.
    # Emergency bypass: re-run the failed job, or intentionally edit this
    # workflow — bypassing a hard gate must be a deliberate act.
    - name: Install Playwright Chromium (canary gate)
      run: npx playwright install --with-deps chromium

    - name: Canary gate (attempt 1)
      id: canary-attempt-1
      run: |
        set +e
        set -o pipefail
        xvfb-run -a node scripts/real-site-verify.mjs 2>&1 | tee /tmp/canary-release-attempt1.log
        code=${PIPESTATUS[0]:-0}
        echo "code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Canary gate (retry)
      id: canary-attempt-2
      if: steps.canary-attempt-1.outputs.code == '1'
      run: |
        set +e
        set -o pipefail
        xvfb-run -a node scripts/real-site-verify.mjs 2>&1 | tee /tmp/canary-release-attempt2.log
        code=${PIPESTATUS[0]:-0}
        echo "code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Canary gate outcome
      run: |
        c1="${{ steps.canary-attempt-1.outputs.code }}"
        c2="${{ steps.canary-attempt-2.outputs.code }}"
        effective="${c2:-$c1}"
        case "$effective" in
          0) echo "Canary gate PASSED";;
          2) echo "::warning::Canary gate SKIPPED-ENV (Google endpoint throttled) — releasing without the real-site signal this time";;
          *) echo "Canary gate FAILED (exit $effective)"; exit 1;;
        esac

    - name: Upload canary logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: canary-release-logs
        path: /tmp/canary-release-attempt*.log
        retention-days: 30

    - name: Create ZIP archive
      run: |
        cd dist/chrome
        zip -r ../../DualTran-${{ github.ref_name }}.zip .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: DualTran-${{ github.ref_name }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
