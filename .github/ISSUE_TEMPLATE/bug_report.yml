name: Bug Report
description: Report a bug to help us improve DualTran
title: "[BUG] "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: dropdown
    id: service
    attributes:
      label: Translation Service
      options:
        - Google Translate
        - AI Translation (OpenAI)
        - AI Translation (DeepSeek)
        - AI Translation (Anthropic)
        - AI Translation (Google Gemini)
        - AI Translation (Other)
        - N/A
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      placeholder: "e.g., 2.1.30"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Brave
        - Firefox
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g., Windows 11, macOS 14, Ubuntu 22.04"
    validations:
      required: true

  - type: dropdown
    id: state-anomaly
    attributes:
      label: Is this a button-state mismatch issue? (advanced QA)
      description: The translation state shown by the button (Original/Google/AI highlight) disagrees with the actual page content.
      options:
        - "Yes — the button highlight disagrees with the page"
        - "No"
        - "Not sure"
    validations:
      required: false

  - type: dropdown
    id: spa-site
    attributes:
      label: Does it reproduce on an SPA site (GitHub, X/Twitter, etc.)?
      description: These sites navigate without a full page load (Turbo/pjax), which is a known source of button-state bugs.
      options:
        - "Yes — I'll name the site"
        - "No, a regular web page"
        - "Not sure"
    validations:
      required: false

  - type: dropdown
    id: state-recover
    attributes:
      label: Does the state recover after a page reload / navigating away and back?
      options:
        - "Recovers after reload"
        - "Still wrong after reload"
        - "Not tested"
    validations:
      required: false

  - type: textarea
    id: state-steps
    attributes:
      label: Exact action sequence when the state was wrong (if applicable)
      description: "For example: translate the page → click Google → click AI → navigate (back/forward) → the button shows X"
      placeholder: |
        1. Open a GitHub repository page
        2. Click the Google button to translate
        3. Click an in-repo link (SPA navigation)
        4. Browser back
        5. The page shows translated text but the button highlights Original
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: "Open Chrome DevTools (F12) → Console tab, and paste any error messages."
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem.
